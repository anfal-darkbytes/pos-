    <circle cx="23" cy="12" r="1.8" fill="#ffffff" />
    <circle cx="23" cy="12" r="3.2" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.5" />
  </g>

  <!-- Wordmark: Pulse -->
  <text x="56" y="32" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="currentColor" letter-spacing="-0.5">Pulse</text>


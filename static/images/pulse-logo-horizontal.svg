    <rect x="0.8" y="0.8" width="42.4" height="42.4" rx="11.2" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2" />
    <path d="M 8 23.5 H 14 L 17 29.5 L 23 12 L 27.5 32 L 31 20.5 L 34 23.5 H 37" 
